name: specimen
version: 2
doc_type: pathology_report
kind: entity
order: 10
scope: document
title: Specimen
instruction: |
  Enumerate every distinct SPECIMEN (part) reported in this pathology report.
  Each specimen becomes the target of later per-specimen questions (procedure,
  carcinoma status, dysplasia), so the list must be complete and must not
  contain duplicates.

  - A specimen is a separately submitted part, usually labeled with a letter or
    number ("A.", "B)", "Part 2", "Specimen C"). One report often has several.
  - The same part is typically mentioned in several sections (final diagnosis,
    specimens received, gross description, addenda). Report it ONCE, citing
    its diagnosis-section designation when present, otherwise the
    "Specimens Received"/gross designation.
  - A part that consists of slides or blocks received for consultation or
    second opinion (e.g. "Material(s) Received A: 1 consult slide") IS a
    specimen, even when no diagnosis is given: it is the patient's tissue.
  - Do NOT create separate entries for the blocks, slides, levels or stains
    OF a part (e.g. "A1", "C2"), for specimens of a different/prior case
    mentioned in the clinical history, or for disclaimer/methodology text.
  - Layouts may be flattened, so parts can appear out of order or interleaved.
    Read the whole report.
  - If the report gives a diagnosis but never labels parts, report a single
    specimen with label null.
  - If the report contains no specimen at all (e.g. only a disclaimer or a
    fragment without any diagnosis or specimen designation), abstain.
  - List specimens in label order.
value_description: >
  The specimen designation as written, e.g. "Anterior subglottis; biopsy" or
  "Prostate, right base medial; needle biopsy".
attributes:
  label:
    type: string
    nullable: true
    description: >
      The part label exactly as written without punctuation (e.g. "A", "B",
      "2"), or null if the report does not label parts.
  site:
    type: string
    nullable: true
    description: >
      The anatomic site of the specimen as worded in the report, including
      laterality and subsite only if written (e.g. "Right true vocal cord mid
      superior"). Take it from the part's own designation (diagnosis heading,
      specimens-received list) or its gross/container description. Only if
      neither states a site, the report has exactly ONE specimen, and the
      clinical history names exactly ONE site or lesion, use that site and
      include the clinical-history quote in evidence. Otherwise null.
  site_source:
    type: enum
    nullable: true
    values:
      designation: From the part's designation (diagnosis heading or specimens-received list).
      gross: From the gross or container description of the part.
      clinical_history: From the clinical history (single-specimen reports only, see site).
    description: Where `site` was taken from; null exactly when site is null.
  material:
    type: enum
    values:
      submitted_tissue: Tissue or cytology material from the procedure, received by this laboratory (fresh, in formalin, aspirate).
      outside_slides: Slides only, received from another institution for consultation/review.
      outside_blocks: Paraffin blocks (with or without slides) received from another institution.
      not_stated: The report does not say what was received for this part.
    description: What this laboratory received for the part.
target_instruction: |
  Answer ONLY about this specimen. Statements in the report that refer to a
  different part label, or to a different case in the clinical history, are out
  of scope. A statement without a part label applies to this specimen only if
  the report has a single specimen or the statement explicitly covers all parts.
examples:
  - excerpt: >-
      A.  Left lateral tongue; excision:  - Invasive squamous cell carcinoma.
      B.  Left level II lymph nodes; dissection:  - Three lymph nodes, no
      carcinoma identified (0/3).  Specimens Received: A: Left lateral tongue B: Left
      neck level II  Gross: A. Received fresh labeled "left tongue"... A1-A6.
      B. Received in formalin labeled "level II"... B1-B3.
    output:
      extractions:
        - evidence: ["A.  Left lateral tongue; excision:"]
          justification: Part A in the final diagnosis; the gross and specimens-received mentions are the same part.
          assertion: affirmed
          value: "Left lateral tongue; excision"
          label: "A"
          site: "Left lateral tongue"
          site_source: designation
          material: submitted_tissue
        - evidence: ["B.  Left level II lymph nodes; dissection:"]
          justification: Part B in the final diagnosis.
          assertion: affirmed
          value: "Left level II lymph nodes; dissection"
          label: "B"
          site: "Left level II lymph nodes"
          site_source: designation
          material: submitted_tissue
      summary: Two labeled parts, both received from the procedure. A1-A6 and B1-B3 are blocks, not specimens.
  - excerpt: >-
      Surgical Pathology Report  - Squamous cell carcinoma in-situ.
    output:
      extractions:
        - evidence: ["- Squamous cell carcinoma in-situ."]
          justification: A diagnosis is reported without any part label or site, so there is one unlabeled specimen.
          assertion: affirmed
          value: "Squamous cell carcinoma in-situ."
          label: null
          site: null
          site_source: null
          material: not_stated
      summary: Single unlabeled specimen; no site and no received material are stated.
  - excerpt: >-
      The performance characteristics of immunohistochemistry tests performed in
      this laboratory have been determined and validated by the laboratory.
    output:
      extractions: []
      summary: Only methodology disclaimer text; no specimen or diagnosis is present.
  - excerpt: >-
      Clinical History: 58-year-old with a left tonsil mass.  Material(s)
      Received A: Received from Outside Hospital is 2 consult slides labeled
      XX-XXXX, accompanied by an outside report.
    output:
      extractions:
        - evidence: ["Material(s) Received A:", "left tonsil mass"]
          justification: >-
            Part A is consult slides from another institution, which is a
            specimen. The part itself states no site; the report has one
            specimen and the history names one lesion, so the site comes from
            the clinical history.
          assertion: affirmed
          value: "2 consult slides"
          label: "A"
          site: "left tonsil"
          site_source: clinical_history
          material: outside_slides
      summary: One consult specimen (slides only); site taken from the clinical history.
