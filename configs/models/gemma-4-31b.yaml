# Google Gemma 4 31B IT (dense, BF16 ~62 GB)
# Sources: huggingface.co/google/gemma-4-31B-it, vllm recipes Google/Gemma4.md (checked 2026-11-06)
name: gemma-4-31b
served_model_name: gemma-4-31b
temperature: 1.0
top_p: 0.95
top_k: 64
max_tokens: 49152   # max-model-len 65536 leaves ~16k for the prompt (largest seen: 10.5k); longer prompts fall back to the remaining context
reasoning:
  # Thinking is OFF by default; on/off only (no effort levels).
  chat_template_kwargs: {enable_thinking: true}
# Documented: "Structured Outputs with Thinking" (response_format json_schema).
# The model does not see schema descriptions; our prompt states field semantics in text.
structured_output: json_schema
