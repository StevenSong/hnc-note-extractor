# Meta Muse Glimmer 30B (dense, BF16 59.6 GB)
# Sources: huggingface.co/meta-models/Muse-Glimmer-30B, vllm recipes (checked 2026-11-06).
# Hopper is not on the recipe's verified-hardware list.
name: muse-glimmer-30b
served_model_name: muse-glimmer-30b
temperature: 1.0   # recipe: never greedy
top_p: 0.95
top_k: 64
max_tokens: 49152   # max-model-len 65536 leaves ~16k for the prompt (largest seen: 10.5k); longer prompts fall back to the remaining context
reasoning:
  # Effort is set by a system-prompt line: low | medium | high (template default) | xhigh
  system_prompt_suffix: "Reasoning strength: xhigh"
# The muse_glimmer reasoning parser only ends the reasoning phase on a tool
# channel, so a response_format grammar may never be applied to the answer.
# Use parse + validate + retry until `probe` shows json_schema works.
structured_output: none
