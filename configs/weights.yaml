# Model weights, pre-pulled on every node as full clones of the repo head
# (hf download <repo> --local-dir $HNC_MODELS_ROOT/<repo>). Jobs never download; they
# check the sha256 of every pinned file and record each file's revision.
#
# An entry without `files` refuses to serve. To pin one, on a node:
#   slurm/submit.sh --cpus-per-task=16 -- hnc_extract weights-pin <name>
# then paste the printed `files:` block here and commit it.

qwen3.8-27b:
  repo: Qwen/Qwen3.8-27B

muse-glimmer-30b:
  repo: meta-models/Muse-Glimmer-30B

gemma-4-31b:
  repo: google/gemma-4-31B-it

nemotron-3.5-super-nvfp4:
  repo: nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
